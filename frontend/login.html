<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Finova AI - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 900px;
            max-width: 95%;
            min-height: 550px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.12);
            display: flex;
            overflow: hidden;
        }

        .left {
            width: 50%;
            background: #111827;
            color: white;
            padding: 60px 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .left h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .left p {
            color: #d1d5db;
            line-height: 1.6;
            font-size: 16px;
        }

        .right {
            width: 50%;
            padding: 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .right h2 {
            font-size: 30px;
            color: #111827;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #374151;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #111827;
        }

        .main-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #111827;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .main-btn:hover {
            background: #000000;
        }

        .switch-text {
            text-align: center;
            margin-top: 22px;
            color: #6b7280;
        }

        .switch-btn {
            background: none;
            border: none;
            color: #111827;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            color: #dc2626;
            min-height: 20px;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 700px) {
            .container {
                flex-direction: column;
            }

            .left,
            .right {
                width: 100%;
            }

            .left {
                padding: 35px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- LEFT SIDE -->
    <div class="left">
        <h1>Finova AI</h1>

        <p>
            Your intelligent financial decision assistant.
            Track expenses, manage goals, analyze investments
            and make smarter financial decisions.
        </p>
    </div>


    <!-- RIGHT SIDE -->
    <div class="right">

        <!-- LOGIN FORM -->
        <div id="loginSection">

            <h2>Welcome Back</h2>

            <p class="subtitle">
                Login to your Finova account
            </p>

            <form onsubmit="login(event)">

                <div class="form-group">
                    <label>Email</label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Password</label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="main-btn">
                    Login
                </button>

            </form>

            <div class="switch-text">
                Don't have an account?

                <button
                    type="button"
                    class="switch-btn"
                    onclick="showRegister()"
                >
                    Create Account
                </button>
            </div>

        </div>


        <!-- REGISTER FORM -->
        <div id="registerSection" class="hidden">

            <h2>Create Account</h2>

            <p class="subtitle">
                Create your Finova account
            </p>

            <form onsubmit="register(event)">

                <div class="form-group">
                    <label>Full Name</label>

                    <input
                        type="text"
                        id="registerName"
                        placeholder="Enter your name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Email</label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Password</label>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >
                </div>

                <button type="submit" class="main-btn">
                    Create Account
                </button>

            </form>

            <div class="switch-text">
                Already have an account?

                <button
                    type="button"
                    class="switch-btn"
                    onclick="showLogin()"
                >
                    Login
                </button>
            </div>

        </div>


        <div id="authMessage" class="message"></div>

    </div>

</div>


<script>

const API_URL = "http://127.0.0.1:5000";


function showRegister() {

    document.getElementById("loginSection")
        .classList.add("hidden");

    document.getElementById("registerSection")
        .classList.remove("hidden");

    document.getElementById("authMessage")
        .textContent = "";
}


function showLogin() {

    document.getElementById("registerSection")
        .classList.add("hidden");

    document.getElementById("loginSection")
        .classList.remove("hidden");

    document.getElementById("authMessage")
        .textContent = "";
}


async function register(event) {

    event.preventDefault();

    const name =
        document.getElementById("registerName").value.trim();

    const email =
        document.getElementById("registerEmail").value.trim();

    const password =
        document.getElementById("registerPassword").value;


    try {

        const response = await fetch(
            API_URL + "/api/register",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                credentials: "include",

                body: JSON.stringify({
                    name: name,
                    email: email,
                    password: password
                })
            }
        );


        const data = await response.json();


        if (!response.ok) {

            document.getElementById("authMessage")
                .textContent =
                data.error || "Registration failed";

            return;
        }


        document.getElementById("authMessage").style.color =
            "#16a34a";

        document.getElementById("authMessage")
            .textContent =
            "Account created successfully!";


        setTimeout(function() {

            window.location.href = "index.html";

        }, 800);


    } catch (error) {

        console.error(error);

        document.getElementById("authMessage").style.color =
            "#dc2626";

        document.getElementById("authMessage")
            .textContent =
            "Cannot connect to the server.";

    }
}


async function login(event) {

    event.preventDefault();

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;


    try {

        const response = await fetch(
            API_URL + "/api/login",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                credentials: "include",

                body: JSON.stringify({
                    email: email,
                    password: password
                })
            }
        );


        const data = await response.json();


        if (!response.ok) {

            document.getElementById("authMessage")
                .textContent =
                data.error || "Login failed";

            return;
        }


        document.getElementById("authMessage").style.color =
            "#16a34a";

        document.getElementById("authMessage")
            .textContent =
            "Login successful!";


        setTimeout(function() {

            window.location.href = "index.html";

        }, 500);


    } catch (error) {

        console.error(error);

        document.getElementById("authMessage").style.color =
            "#dc2626";

        document.getElementById("authMessage")
            .textContent =
            "Cannot connect to the server.";

    }

}

</script>

</body>
</html>
