<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expenses | Finova AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            <div class="logo-icon">F</div>
            <span>Finova AI</span>
        </div>

        <nav>

            <a href="index.html">
                🏠 Dashboard
            </a>

            <a href="advisor.html">
                🤖 AI Advisor
            </a>

            <a class="active" href="expenses.html">
                💳 Expenses
            </a>

            <a href="investments.html">
                📈 Investments
            </a>

            <a href="goals.html">
                🎯 Goals
            </a>

            <a href="alerts.html">
                🔔 Alerts
            </a>
            <a href="profile.html">👤 Profile</a>

        </nav>

    </aside>


    <!-- MAIN -->
    <main class="main">

        <header>

            <div>
                <p class="small-title">
                    MONEY MANAGEMENT
                </p>

                <h1>
                    Expenses 💳
                </h1>

                <p class="subtitle">
                    Track where your money goes.
                </p>
            </div>

        </header>


        <!-- ADD EXPENSE -->

        <div class="panel">

            <h2>Add New Expense</h2>

            <br>

            <input
                id="amount"
                type="number"
                placeholder="Amount ₹"
                style="padding:15px; width:100%; border-radius:10px; border:1px solid #ddd;"
            >

            <br><br>

            <select
                id="category"
                style="padding:15px; width:100%; border-radius:10px; border:1px solid #ddd;"
            >

                <option value="Food">🍔 Food</option>
                <option value="Fuel">⛽ Fuel</option>
                <option value="Travel">✈️ Travel</option>
                <option value="Shopping">🛍️ Shopping</option>
                <option value="Education">📚 Education</option>
                <option value="Bills">💡 Bills</option>
                <option value="Health">❤️ Health</option>
                <option value="Other">📦 Other</option>

            </select>

            <br><br>

            <input
                id="description"
                type="text"
                placeholder="Description"
                style="padding:15px; width:100%; border-radius:10px; border:1px solid #ddd;"
            >

            <br><br>

            <button
                class="ai-button"
                onclick="addExpense()"
            >
                + Add Expense
            </button>

        </div>


        <br>


        <!-- EXPENSE LIST -->

        <div class="panel">

            <div class="panel-header">

                <h2>
                    Recent Expenses
                </h2>

                <span>
                    All transactions
                </span>

            </div>

            <div id="expenseList">
                Loading expenses...
            </div>

        </div>

    </main>

</div>


<script>

const API = "http://127.0.0.1:5000/api";


async function addExpense() {

    const amount =
        document.getElementById("amount").value;

    const category =
        document.getElementById("category").value;

    const description =
        document.getElementById("description").value;


    if (!amount) {

        alert("Please enter an amount.");

        return;

    }


    try {

        const response = await fetch(
            `${API}/expenses`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    amount: amount,

                    category: category,

                    description: description

                })
            }
        );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                data.error ||
                "Something went wrong."
            );

            return;

        }


        alert("✅ Expense added successfully!");


        document.getElementById("amount").value = "";

        document.getElementById("description").value = "";


        loadExpenses();


    } catch (error) {

        console.error(error);

        alert(
            "Cannot connect to Flask server."
        );

    }

}


async function loadExpenses() {

    try {

        const response =
            await fetch(`${API}/expenses`);

        const expenses =
            await response.json();


        const list =
            document.getElementById("expenseList");


        if (expenses.length === 0) {

            list.innerHTML = `
                <div style="padding:30px; text-align:center;">
                    <h3>💸 No expenses yet</h3>
                    <p>Add your first expense above.</p>
                </div>
            `;

            return;

        }


        list.innerHTML = expenses.map(
            expense => `

            <div style="
                padding:18px;
                margin-bottom:12px;
                background:#f5f7fb;
                border-radius:14px;
                display:flex;
                justify-content:space-between;
                align-items:center;
            ">

                <div>

                    <strong>
                        ${expense.category}
                    </strong>

                    <br>

                    <small>
                        ${expense.description || "No description"}
                    </small>

                </div>


                <strong style="font-size:18px;">
                    ₹${Number(expense.amount).toLocaleString()}
                </strong>

            </div>

            `
        ).join("");


    } catch (error) {

        console.error(error);

        document.getElementById(
            "expenseList"
        ).innerHTML =
            "Unable to load expenses.";

    }

}


loadExpenses();

</script>

</body>

</html>
